# Install this on the Node server and replace flow.example.com.
server {
    listen 443 ssl http2;
    server_name flow.example.com;

    # Configure certificates using your normal ACME/certificate process.
    ssl_certificate     /etc/ssl/flow/fullchain.pem;
    ssl_certificate_key /etc/ssl/flow/privkey.pem;

    client_max_body_size 32k;

    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 20m;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
